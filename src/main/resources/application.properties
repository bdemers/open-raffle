spring.application.name=open-raffle
server.port=8080

# Public base URL embedded in participant QR codes: scheme, host, and port if not the
# default, e.g. https://raffle.example.com or http://192.168.1.20:8081. Phones must be
# able to open it. Leave empty to derive it from each request (fine for local dev);
# set RAFFLE_PUBLIC_URL explicitly in production.
raffle.public-url=${RAFFLE_PUBLIC_URL:}
# Trust X-Forwarded-Proto/Host/Port from the reverse proxy so request-derived URLs
# (and OIDC redirect URIs) use the public scheme and host.
server.forward-headers-strategy=framework

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/raffle}
spring.datasource.username=${DB_USER:raffle}
spring.datasource.password=${DB_PASSWORD:raffle}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Keycloak (OpenID Connect) ---
# The issuer must be the same URL from the browser and from the app process, so in
# dev the app runs on the host against the shared Keycloak in ../local-keycloak.
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:8180/realms/open-raffle}
spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID:open-raffle-app}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:open-raffle-dev-secret}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email

# --- Vaadin ---
vaadin.launch-browser=false
vaadin.allowed-packages=com.vaadin,org.vaadin,org.openraffle

logging.level.org.atmosphere=warn
