# Local infrastructure for Open Raffle: just Postgres.
#
# Keycloak is shared across projects and lives in ../local-keycloak; it imports
# ./keycloak/open-raffle-realm.json. Start it first:
#   (cd ../local-keycloak && docker compose up -d)
#
# In dev, run the app from the host so it and the browser reach Keycloak at the
# same issuer URL (http://localhost:8180/realms/open-raffle):
#   mvn spring-boot:run -Dspring-boot.run.arguments=--server.port=8081
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: raffle
      POSTGRES_USER: raffle
      POSTGRES_PASSWORD: raffle
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raffle -d raffle"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
